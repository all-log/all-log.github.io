<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>올영 오특</title>

<style>
  /* 이 페이지는 항상 밝은 화면으로 고정한다(레퍼런스 사이트와 동일 톤).
     시스템이 다크모드여도 바뀌지 않도록 다크 분기를 두지 않는다 — 의도적 선택. */
  :root {
    --ground: #F5F6F8;
    --surface: #FFFFFF;
    --surface-2: #EEF0F3;
    --ink: #151723;
    --mid: #5B5F6E;
    --muted: #9599A6;
    --line: #E4E6EB;
    --green: #1F9D6E;
    --green-bg: #E7F7EF;
    --red: #E0483C;
    --purple: #7C3AED;
    --purple-bg: #F2EBFD;
    --shadow: 0 1px 2px rgba(21,23,35,.04), 0 6px 20px rgba(21,23,35,.06);
    --radius: 12px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
                 "Apple SD Gothic Neo", sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

  .topnav {
    position: sticky; top: 0; z-index: 50; background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .topnav-inner {
    max-width: 1180px; margin: 0 auto; padding: 13px 20px;
    display: flex; align-items: center; gap: 20px;
  }
  .brand { font-weight: 800; font-size: 18px; flex: none; }
  .brand .accent { color: var(--purple); }

  .page-head { padding: 28px 0 6px; }
  .page-head h1 { font-size: 22px; margin: 0 0 6px; }
  .page-head .sub { font-size: 13.5px; color: var(--muted); margin: 0; }

  /* ============ 오특 ============ */
  .ot-section { margin-bottom: 32px; }
  .ot-section h2 { font-size: 15px; font-weight: 800; margin: 0 0 4px; }
  .ot-section .ot-sub { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; }

  .ot-stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    margin-bottom: 26px; }
  .ot-stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow); }
  .ot-stat .n { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; display: block; }
  .ot-stat .l { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

  .ot-daypicker { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .ot-day-chip { font: inherit; font-size: 12.5px; font-weight: 700; padding: 7px 14px;
    border-radius: 99px; border: 1px solid var(--line); background: var(--surface);
    color: var(--mid); cursor: pointer; font-variant-numeric: tabular-nums; }
  .ot-day-chip[aria-pressed="true"] { background: var(--purple); border-color: var(--purple); color: #fff; }

  .ot-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    margin-bottom: 8px; }
  .ot-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px;
    text-decoration: none; color: inherit; }
  .ot-card:hover { border-color: var(--purple); }
  .ot-card-top { display: flex; justify-content: space-between; align-items: center; }
  .ot-brand { font-size: 11px; font-weight: 700; color: var(--purple);
    letter-spacing: .03em; }
  .ot-repeat-badge { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 99px;
    background: var(--green-bg); color: var(--green); white-space: nowrap; }
  .ot-name { font-size: 13.5px; font-weight: 700; line-height: 1.4; }
  .ot-prices { display: flex; align-items: baseline; gap: 8px; }
  .ot-sale { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .ot-list { font-size: 12px; color: var(--muted); text-decoration: line-through;
    font-variant-numeric: tabular-nums; }
  .ot-dc { font-size: 12.5px; font-weight: 800; color: var(--red); }
  .ot-cat { font-size: 11px; color: var(--muted); }
  .ot-note { font-size: 10.5px; color: var(--muted); border-top: 1px dashed var(--line);
    padding-top: 7px; margin-top: 2px; }

  .ot-brandbar-row { display: grid; grid-template-columns: 100px 1fr 32px; gap: 10px;
    align-items: center; font-size: 12.5px; margin-bottom: 7px; }
  .ot-brandbar-track { background: var(--surface-2); border-radius: 5px; height: 8px; overflow: hidden; }
  .ot-brandbar-fill { height: 100%; background: var(--purple); opacity: .85; }
  .ot-brandbar-val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  .ot-empty-note { background: var(--surface-2); border-radius: 10px; padding: 16px 18px;
    font-size: 12.5px; color: var(--mid); line-height: 1.6; }
  .ot-empty-note code { background: var(--surface); padding: 1px 5px; border-radius: 4px; }

  footer { border-top: 1px solid var(--line); padding: 24px 0 50px;
    font-size: 12.5px; color: var(--muted); }
  footer p { margin: 0 0 5px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

      ${!isMultiDay ? `
      <div class="ot-empty-note" style="margin-top:16px">
        <strong>아직 하루치입니다.</strong> 오특은 매일 자정에 바뀌므로, 하루치로는
        추세를 볼 수 없습니다. 확장으로 매일 기록을 쌓으면 날짜별 추이·재등장
        상품·브랜드 빈도가 여기 함께 나타납니다.
      </div>` : ""}
    </div>

    ${isMultiDay ? `
    <div class="ot-section">
      <h2>날짜별 오특 수 · 평균 할인율</h2>
      <p class="ot-sub">날짜를 눌러 그날 오특 목록을 봅니다.</p>
      <div class="ot-daypicker" id="ot-daypicker"></div>
    </div>` : ""}

    ${repeatsToday.length ? `
    <div class="ot-section">
      <h2>오늘 다시 나온 상품 (${repeatsToday.length}개)</h2>
      <p class="ot-sub">이전에도 오특이었던 상품입니다 — 세일이 끝나도 다시 돌아올 수 있다는 뜻입니다.</p>
      <div class="ot-grid">
        ${repeatsToday.map(i => otCardHTML(i, { showSection: true })).join("")}
      </div>
    </div>` : ""}

    ${brandItems.length ? `
    <div class="ot-section">
      <h2>오늘의 브랜드 특가 (${brandItems.length}개)</h2>
      <p class="ot-sub">한 브랜드가 여러 상품을 채우는 브랜드데이 특가.</p>
      <div class="ot-grid">
        ${brandItems.map(otCardHTML).join("")}
      </div>
    </div>` : ""}

    ${generalItems.length ? `
    <div class="ot-section">
      <h2>오늘의 특가 (${generalItems.length}개)</h2>
      <p class="ot-sub">여러 브랜드가 섞인 일반 오특 목록. 할인율 높은 순.</p>
      <div class="ot-grid">
        ${generalItems.map(otCardHTML).join("")}
      </div>
    </div>` : ""}

    ${unclassified.length ? `
    <div class="ot-section">
      <h2>기타 기록 (${unclassified.length}개)</h2>
      <p class="ot-sub">섹션 구분 없이 기록된 옛 데이터입니다.</p>
      <div class="ot-grid">
        ${unclassified.map(otCardHTML).join("")}
      </div>
    </div>` : ""}

    ${OT.brands.length ? `
    <div class="ot-section">
      <h2>브랜드 등장 빈도</h2>
      <p class="ot-sub">전체 기록 기간 동안 오특에 가장 자주 나온 브랜드입니다.
        데이터가 쌓일수록 이 목록이 더 의미 있어집니다.</p>
      <div id="ot-brandbars"></div>
    </div>` : ""}
  `;

  if (isMultiDay) {
    const picker = document.getElementById("ot-daypicker");
    picker.innerHTML = OT.daily.map(d => `
      <button class="ot-day-chip" data-date="${d.date}" aria-pressed="${d.date === otSelectedDate}">
        ${d.date} (${d.count})
      </button>
    `).join("");
    picker.querySelectorAll(".ot-day-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        otSelectedDate = btn.dataset.date;
        renderOtteuk();
      });
    });
  }

  if (OT.brands.length) {
    const max = Math.max(...OT.brands.map(([, n]) => n));
    document.getElementById("ot-brandbars").innerHTML = OT.brands.map(([name, n]) => `
      <div class="ot-brandbar-row">
        <span>${esc(name)}</span>
        <div class="ot-brandbar-track"><div class="ot-brandbar-fill" style="width:${(n / max * 100).toFixed(0)}%"></div></div>
        <span class="ot-brandbar-val">${n}</span>
      </div>
    `).join("");
  }
}

function otCardHTML(i, opts = {}) {
  const repeatBadge = i[OTF.repeat] === 1
    ? `<span class="ot-repeat-badge">재등장 · ${i[OTF.seen].length}회</span>` : "";
  const sectionTag = (opts.showSection && i[OTF.section])
    ? `<span class="ot-brand" style="color:var(--muted)">${esc(i[OTF.section])}</span>` : "";
  return `
    <a class="ot-card" href="${esc(i[OTF.url])}" target="_blank" rel="noopener noreferrer">
      <div class="ot-card-top">
        <span class="ot-brand">${esc(i[OTF.br] || "브랜드 미상")}</span>
        ${repeatBadge}
      </div>
      <div class="ot-name">${esc(i[OTF.nm])}</div>
      <div class="ot-prices">
        <span class="ot-sale">${fmtWon(i[OTF.sp])}</span>
        ${i[OTF.lp] && i[OTF.lp] !== i[OTF.sp] ? `<span class="ot-list">${fmtWon(i[OTF.lp])}</span>` : ""}
        ${i[OTF.dc] != null ? `<span class="ot-dc">-${i[OTF.dc]}%</span>` : ""}
      </div>
      ${i[OTF.cat] ? `<div class="ot-cat">${esc(i[OTF.cat])}${sectionTag ? " · " + sectionTag : ""}</div>` : sectionTag}
      ${i[OTF.note] ? `<div class="ot-note">${esc(i[OTF.note])}</div>` : ""}
    </a>
  `;
}

renderOtteuk();
</script>

</body>
</html>
